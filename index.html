<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafío Interactivo - Verdadero o Falso</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Carga del archivo de preguntas externo -->
    <script src="./preguntas.js"></script>
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Fredoka & Inter (Estilo Canva Didáctico) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        fredoka: ['Fredoka', 'sans-serif'],
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        canvaPurple: '#7D2AE8',
                        canvaPink: '#FF5757',
                        canvaYellow: '#FFBD59',
                        canvaGreen: '#00C2CB',
                        canvaDark: '#1E1E2F',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Fredoka', sans-serif;
            background: linear-gradient(135deg, #7D2AE8 0%, #00C2CB 100%);
            min-height: 100vh;
        }
        .pop-card {
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.2), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }
        .timer-bar {
            transition: width 0.1s linear;
        }
        @keyframes bounce-short {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        .bounce-active {
            animation: bounce-short 0.4s ease infinite;
        }
    </style>
</head>
<body class="flex items-center justify-center p-4 min-h-screen text-slate-800">

    <!-- Configuración de Google Apps Script URL -->
    <script>
        const GOOGLE_SHEETS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwVvqXAkNDfrGswlpa6NxfIeLHS4xOoUCnrxIgIX7k0GPdzYxZvLr-q5DpOjnlNQfA/exec";
    </script>

    <!-- Contenedor Principal Estilo Canva -->
    <main class="w-full max-w-xl bg-white rounded-3xl pop-card overflow-hidden border-4 border-white relative min-h-[550px] flex flex-col justify-between p-6 sm:p-8">

        <!-- Header Superior -->
        <header class="flex justify-between items-center pb-4 border-b-2 border-slate-100">
            <div class="flex items-center gap-2">
                <div class="bg-canvaPurple text-white p-2 rounded-xl text-lg font-bold">
                    <i class="fa-solid fa-graduation-cap"></i>
                </div>
                <span class="text-xl font-bold text-canvaPurple tracking-wide">Desafío Interactivo</span>
            </div>
            <div id="playerBadge" class="hidden bg-slate-100 px-3 py-1 rounded-full text-sm font-semibold text-slate-600">
                <i class="fa-solid fa-user text-canvaPurple mr-1"></i> <span id="displayName">-</span>
            </div>
        </header>

        <!-- ==================== PANTALLA 1: BIENVENIDA ==================== -->
        <section id="screenWelcome" class="flex flex-col items-center text-center my-auto py-6 space-y-6">
            <div class="w-24 h-24 bg-canvaYellow/20 text-canvaYellow rounded-full flex items-center justify-center text-5xl mb-2 bounce-active">
                <i class="fa-solid fa-bolt text-amber-500"></i>
            </div>
            <div>
                <h1 class="text-3xl sm:text-4xl font-bold text-slate-800 leading-tight mb-2">¿Cuánto sabes del tema?</h1>
                <p class="text-slate-500 font-sans text-sm sm:text-base">Responde Verdadero o Falso antes de que el tiempo se agote. ¡Demuestra tu rapidez!</p>
            </div>

            <form id="startForm" onsubmit="startGame(event)" class="w-full space-y-4 pt-4">
                <div class="text-left">
                    <label class="block text-sm font-bold text-slate-700 mb-1 ml-1" for="username">Tu Nombre o Apodo:</label>
                    <input 
                        type="text" 
                        id="username" 
                        required
                        maxlength="20"
                        placeholder="Escribe tu nombre aquí..." 
                        class="w-full px-5 py-4 rounded-2xl border-2 border-slate-200 focus:border-canvaPurple focus:outline-none text-lg font-sans font-medium transition"
                    />
                </div>
                <button 
                    type="submit" 
                    class="w-full py-4 bg-canvaPurple hover:bg-purple-700 text-white font-bold text-xl rounded-2xl shadow-lg hover:shadow-xl transition transform active:scale-95 flex items-center justify-center gap-3">
                    <i class="fa-solid fa-play"></i> ¡Comenzar Juego!
                </button>
            </form>
        </section>

        <!-- ==================== PANTALLA 2: JUEGO ==================== -->
        <section id="screenGame" class="hidden flex-col justify-between my-auto py-4 space-y-6">
            <div class="space-y-3">
                <div class="flex justify-between items-center font-bold text-sm text-slate-500">
                    <span id="questionCounter">Pregunta 1 de 5</span>
                    <span class="text-amber-500 flex items-center gap-1">
                        <i class="fa-solid fa
